# PetterTech.github.io (Settings → Pages → Source: GitHub Actions).
# Builds the static splash page, refreshes latest.json + thumbnail from the YouTube RSS feed, deploys to Pages.
# Runs on every push to main, a few times a day (to pick up new uploads), and by hand.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps both up to date.
name: Deploy splash page

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9,15,21 * * *'   # 3x daily; avoids the 01–07 UTC window when YouTube RSS often 404s
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage site
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site -Force | Out-Null
          Copy-Item index.html, 404.html, assets -Destination _site -Recurse

      - name: Fetch latest YouTube upload (+ self-hosted thumbnail)
        shell: pwsh
        run: ./tools/Update-LatestVideo.ps1 -Path _site/latest.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
