<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OG image source (not deployed)</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* Rendered at 1200x630 to produce assets/og.png: tools/og/README in the repo README. */
  body{overflow:hidden}
  .og{width:1200px;height:630px;padding:54px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .og .hero{margin:0;grid-template-columns:1fr 400px;gap:10px}
  .og h1{font-size:76px;margin-bottom:18px}
  .og h1 span{white-space:nowrap}
  .og .tagline{font-size:22px;max-width:640px}
  .og .url{font:600 14px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body>
<div class="og">
  <img class="logo" src="/assets/logo-white.png" alt="" width="200" style="width:200px">
  <section class="hero">
    <div>
      <h1>Petter Arnesen<span>aka PetterTech.</span></h1>
      <p class="tagline">Cloud &amp; platform dude. I make Azure and infrastructure a little less painful – one video at a time.</p>
    </div>
    <div class="portrait">
      <svg viewBox="0 0 504 504" aria-hidden="true">
        <g transform="rotate(-16 252 252)"><path class="orbit" d="M14,252 a238,92 0 1,0 476,0 a238,92 0 1,0 -476,0"/><circle r="4" class="spark" cx="40" cy="212"/></g>
        <g transform="rotate(58 252 252)"><path class="orbit" d="M58,252 a194,58 0 1,0 388,0 a194,58 0 1,0 -388,0"/><circle r="3.4" class="spark" cx="430" cy="282"/></g>
      </svg>
      <img src="/assets/petter.jpg" alt="">
    </div>
  </section>
  <span class="url"><span class="tiny-line" style="display:inline-block;vertical-align:middle;margin-right:12px"></span>pettertech.com</span>
</div>
</body>
</html>
